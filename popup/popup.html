<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>双语字幕助手</h1>

  <label class="switch-row">
    <span>启用字幕翻译</span>
    <input type="checkbox" id="enabled" checked>
  </label>

  <label class="row">
    <span>翻译方向</span>
    <select id="direction">
      <option value="auto" selected>自动识别（推荐）</option>
      <option value="zh-CN">英文 → 中文</option>
      <option value="en">中文 → 英文</option>
    </select>
  </label>

  <label class="row">
    <span>显示模式</span>
    <select id="mode">
      <option value="dual" selected>原文 + 译文对照</option>
      <option value="translated">仅译文</option>
    </select>
  </label>

  <div class="section-title">字幕样式</div>
  <label class="row">
    <span>预设</span>
    <select id="style">
      <option value="cinema" selected>影院模式</option>
      <option value="minimal">简洁模式</option>
    </select>
  </label>
  <label class="row">
    <span>字号 <span id="fontsize-label">100%</span></span>
    <input type="range" id="fontsize" min="80" max="160" step="10" value="100">
  </label>
  <label class="row">
    <span>背景</span>
    <select id="background">
      <option value="none" selected>无（描边）</option>
      <option value="translucent">半透明黑底</option>
      <option value="solid">实心黑底</option>
    </select>
  </label>

  <div class="processing-note" role="note">
    <strong>首次处理请耐心等待 1–3 分钟</strong>
    <span>一次性提取并翻译整段字幕；完成后优先复用缓存。</span>
  </div>

  <div class="status-box">
    <div id="status">未检测到视频</div>
  </div>

  <div class="export-box">
    <div class="export-title">📄 导出字幕（Markdown）</div>
    <label class="export-format"><input type="radio" name="fmt" value="dual" checked> 中英对照</label>
    <label class="export-format"><input type="radio" name="fmt" value="translated"> 仅译文</label>
    <label class="export-format"><input type="radio" name="fmt" value="source"> 仅原文</label>
    <button id="export-btn">导出为 .md 文件</button>
    <button id="retranslate-btn" class="secondary">🔄 重新翻译当前视频</button>
    <button id="clear-cache-btn" class="secondary">清除本地翻译缓存</button>
  </div>

  <div class="note">优先使用浏览器本地翻译，不可用时自动使用 Google 在线翻译；无字幕视频由本机 Whisper 识别。<br><a href="../privacy/privacy.html" target="_blank">查看隐私说明</a> · 非官方产品</div>

  <script src="popup.js"></script>
</body>
</html>
